name: Build macOS App

on:
  push:
    tags:
      - 'v*' # 當你推送版號標籤（例如 v1.0.0）時觸發自動打包
  workflow_dispatch: # 允許你在 GitHub 網頁上手動點擊按鈕觸發打包

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib numba pyinstaller

    - name: Build .app with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "LaserAblationSim" app.py

    - name: Create ZIP archive
      run: |
        cd dist
        ditto -c -k --sequesterRsrc LaserAblationSim.app ../LaserAblationSim-macOS.zip
        
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: LaserAblationSim-macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
