name: Build macOS App

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build macOS Application with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "LaserAblationSimulator" app.py

    - name: Zip Executable Output
      run: |
        cd dist
        zip -r LaserAblationSimulator-macOS.zip LaserAblationSimulator.app

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      with:
        files: dist/LaserAblationSimulator-macOS.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
