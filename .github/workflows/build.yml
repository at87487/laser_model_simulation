name: Build macOS App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build macOS Application with PyInstaller
      run: |
        # 加上 --windowed 確保打包成完整的 .app 套件
        pyinstaller --noconfirm --onedir --windowed \
          --hidden-import=numpy \
          --hidden-import=matplotlib \
          --hidden-import=matplotlib.backends.backend_tkagg \
          --hidden-import=numba \
          --name "LaserAblationSimulator" app.py

    - name: Verify Build Output
      run: |
        ls -la dist/
        ls -la dist/LaserAblationSimulator.app/Contents/MacOS/

    - name: Zip Executable Output with Password
      run: |
        cd dist
        zip -r -P 1234 LaserAblationSimulator-macOS.zip LaserAblationSimulator.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaserAblationSimulator-macOS
        path: dist/LaserAblationSimulator-macOS.zip
