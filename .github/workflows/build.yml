name: Build macOS App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch: # 支援在 GitHub 網頁手動點擊觸發

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build macOS Application with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "LaserAblationSimulator" app.py

    - name: Zip Executable Output
      run: |
        cd dist
        zip -r LaserAblationSimulator-macOS.zip LaserAblationSimulator.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaserAblationSimulator-macOS
        path: dist/LaserAblationSimulator-macOS.zip
