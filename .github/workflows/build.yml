name: Build macOS App

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build macOS Application with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "LaserAblationSimulator" app.py

    - name: Zip Executable Output with Password
      run: |
        cd dist
        # 使用 -P 1234 進行密碼加密，避開瀏覽器自動掃描攔截
        zip -r -P 1234 LaserAblationSimulator-macOS.zip LaserAblationSimulator.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaserAblationSimulator-macOS
        path: dist/LaserAblationSimulator-macOS.zip
